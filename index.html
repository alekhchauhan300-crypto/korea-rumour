<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Breaking News</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #111827;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      max-width: 700px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: #ef4444;
      color: white;
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: bold;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 3rem;
      margin: 0 0 20px;
    }

    p {
      font-size: 1.3rem;
      color: #d1d5db;
      line-height: 1.6;
    }

    .footer {
      margin-top: 30px;
      font-size: 0.9rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🚨 RUMOUR ALERT 🚨</div>
    <h1>Korea is ass</h1>
   <p>
  Unverified reports suggest that Korea is ass.
</p>

<p>
  Whoever likes South Korea can kiss my ass.
</p>
    <div class="footer">
      This page is a joke created for friends.
    </div>
  </div>
</body>
</html>
